<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FI Coin — Mini App · серверная</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.1.0/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.1.0/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.1.0/latin-800-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/latin-700-normal.css">
<style>
:root{
  --tg-bg:#0e1621; --tg-panel:#17212b; --tg-panel2:#1e2c3a; --tg-border:#243447;
  --tg-blue:#3390ec; --tg-text:#e9f0f7; --tg-sub:#7d8b99;
  --fi-gold:#f7b32b; --fi-green:#2fd46a; --fi-red:#ff5c5c; --fi-cyan:#37c8ee;
  --em:#17dd62;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Manrope',system-ui,sans-serif;background:#060a10;color:var(--tg-text);display:flex;align-items:center;justify-content:center;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 400px at 15% 10%,rgba(23,221,98,.12),transparent 60%),radial-gradient(700px 500px at 85% 90%,rgba(23,221,98,.08),transparent 60%),radial-gradient(500px 400px at 80% 15%,rgba(51,144,236,.08),transparent 60%)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(23,221,98,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(23,221,98,.04) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%)}
.num{font-variant-numeric:tabular-nums}

#phone{position:relative;width:100%;max-width:430px;height:100dvh;max-height:920px;background:var(--tg-bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 40px 100px rgba(0,0,0,.7)}
@media(min-width:500px) and (min-height:700px){#phone{border-radius:38px;height:min(920px,96dvh)}#phone::before{content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#000;border-radius:14px;z-index:60}}

#tgHeader{flex:0 0 auto;background:linear-gradient(180deg,#1c2a3a,#17212b);border-bottom:1px solid var(--tg-border);padding:14px 14px 10px;z-index:40;position:relative}
@media(min-width:500px) and (min-height:700px){#tgHeader{padding-top:34px}}
.tgRow{display:flex;align-items:center;gap:10px}
.tgAvatar{width:40px;height:40px;border-radius:9px;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 2px rgba(23,221,98,.45),0 0 14px rgba(23,221,98,.25)}
.tgAvatar svg{width:100%;height:100%;display:block}
.tgInfo{flex:1;min-width:0}
.tgName{display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px;white-space:nowrap}
.roleBadge{font-size:8.5px;font-weight:800;letter-spacing:1px;border-radius:6px;padding:2px 6px;font-family:'JetBrains Mono',monospace;display:none;border:1px solid transparent}
.roleBadge.show{display:inline-block}
.tgStatus{font-size:11.5px;color:var(--tg-sub);display:flex;align-items:center;gap:5px}
.dotOnline{width:7px;height:7px;border-radius:50%;background:var(--fi-green);box-shadow:0 0 6px var(--fi-green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.dotOffline{width:7px;height:7px;border-radius:50%;background:var(--fi-red);box-shadow:0 0 6px var(--fi-red)}
.rBadge{font-size:8.5px;font-weight:800;letter-spacing:.6px;border-radius:6px;padding:2px 6px;font-family:'JetBrains Mono',monospace;border:1px solid;flex-shrink:0}

#balanceStrip{flex:0 0 auto;background:linear-gradient(135deg,#1b2836 0%,#1d3328 60%,#153a24 100%);border-bottom:1px solid var(--tg-border);padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:30}
.balCell{flex:1;min-width:0}
.balLabel{font-size:10px;color:var(--tg-sub);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.balVal{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.balVal.usd{color:var(--fi-green)}
.balVal.fi{color:var(--em)}
.priceChip{background:rgba(0,0,0,.28);border:1px solid var(--tg-border);border-radius:10px;padding:5px 10px;text-align:right;flex-shrink:0;cursor:pointer}
.priceChip .p{font-size:13.5px;font-weight:800;color:var(--fi-cyan);font-family:'JetBrains Mono',monospace}
.priceChip .chg{font-size:10.5px;font-weight:700}
.chg.up{color:var(--fi-green)}.chg.dn{color:var(--fi-red)}

#screen{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 20px;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
#tabBar{flex:0 0 auto;display:flex;background:#131c26;border-top:1px solid var(--tg-border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;gap:2px}
.tabBtn{flex:1;background:none;border:none;color:var(--tg-sub);font-family:inherit;font-size:9.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 1px 3px;cursor:pointer;border-radius:8px;transition:.15s}
.tabBtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabBtn.active{color:var(--em)}
.tabBtn.active svg{filter:drop-shadow(0 0 6px rgba(23,221,98,.6))}
.tabBtn:active{transform:scale(.92)}

.sectionTitle{font-size:12px;font-weight:800;color:var(--tg-sub);text-transform:uppercase;letter-spacing:1.2px;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
.sectionTitle::after{content:'';flex:1;height:1px;background:var(--tg-border)}
.sectionTitle:first-child{margin-top:2px}
.card{background:var(--tg-panel);border:1px solid var(--tg-border);border-radius:16px;padding:14px;margin-bottom:10px}
.btn{border:none;font-family:inherit;font-weight:800;border-radius:12px;cursor:pointer;transition:.13s;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.96)}
.btn-em{background:linear-gradient(135deg,#3cf07e,#0ea24a);color:#03230f;box-shadow:0 4px 14px rgba(23,221,98,.35)}
.btn-red{background:rgba(255,92,92,.15);color:var(--fi-red);border:1px solid rgba(255,92,92,.3)}
.btn-blue{background:linear-gradient(135deg,#3d9df3,#2278d4);color:#fff;box-shadow:0 4px 14px rgba(51,144,236,.35)}
.btn-gold{background:linear-gradient(135deg,#ffc94d,#f2921d);color:#3a2600;box-shadow:0 4px 14px rgba(247,179,43,.3)}
.btn-ghost{background:rgba(255,255,255,.05);color:var(--tg-text);border:1px solid var(--tg-border)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none!important}
.btn-sm{padding:8px 14px;font-size:12.5px}
.btn-lg{padding:13px 18px;font-size:14.5px;width:100%}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.statBox{background:var(--tg-panel2);border:1px solid var(--tg-border);border-radius:12px;padding:10px 12px}
.statBox .l{font-size:10px;color:var(--tg-sub);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.statBox .v{font-size:15px;font-weight:800}
.inp{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--tg-border);color:var(--tg-text);font-family:inherit;font-weight:700;font-size:13px;border-radius:10px;padding:10px 12px;outline:none;margin-bottom:8px}
.inp:focus{border-color:var(--em)}
.lbl{font-size:10px;color:var(--tg-sub);font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin:8px 0 5px;display:block}
.inpColor{width:100%;height:44px;background:rgba(0,0,0,.3);border:1px solid var(--tg-border);border-radius:10px;padding:4px 6px;margin-bottom:8px;cursor:pointer}

.bigPrice{font-size:34px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--em);text-align:center;margin-top:4px}
.priceSub{font-size:11.5px;color:var(--tg-sub);text-align:center;font-weight:700}
#spark{width:100%;height:96px;display:block;margin-top:10px}
.spread{display:flex;gap:8px;margin-top:10px}
.spread>div{flex:1;background:var(--tg-panel2);border:1px solid var(--tg-border);border-radius:12px;padding:8px;text-align:center}
.spread .l{font-size:9.5px;color:var(--tg-sub);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.spread .v{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:800;margin-top:2px}
.segRow{display:flex;background:var(--tg-panel2);border:1px solid var(--tg-border);border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
.segRow button{flex:1;border:none;background:transparent;color:var(--tg-sub);font-family:inherit;font-weight:800;font-size:12.5px;padding:9px;border-radius:9px;cursor:pointer}
.segRow button.on{background:linear-gradient(135deg,#0ea24a,#0a913e);color:#fff}
.banner{background:rgba(55,200,238,.12);border:1px solid rgba(55,200,238,.4);color:#7fdcf5;border-radius:12px;padding:9px 12px;font-size:12px;font-weight:700;margin-bottom:10px;text-align:center}
.banner.red{background:rgba(255,92,92,.12);border-color:rgba(255,92,92,.4);color:#ff9d9d}

.minerCard{background:var(--tg-panel);border:1px solid var(--tg-border);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:12px;position:relative;overflow:hidden}
.minerCard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mc,#3390ec);opacity:.85}
.rigArt{width:66px;height:66px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--tg-panel2);border-radius:12px;font-size:30px}
.minerInfo{flex:1;min-width:0}
.minerName{font-weight:800;font-size:14px}
.minerDesc{font-size:10.5px;color:var(--tg-sub);margin-top:2px;line-height:1.35}
.minerMeta{display:flex;gap:10px;margin-top:6px;font-size:11px;font-weight:700;color:var(--tg-sub)}
.minerMeta b{color:var(--em)}
.minerBuy{flex-shrink:0;display:flex;flex-direction:column;justify-content:center;gap:5px;align-items:flex-end}
.minerPrice{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:800;color:var(--fi-gold)}

.ldb{display:flex;align-items:center;gap:8px;background:var(--tg-panel);border:1px solid var(--tg-border);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.ldb .rank{width:28px;height:28px;border-radius:50%;background:var(--tg-panel2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
.ldb.top1 .rank{background:linear-gradient(135deg,#ffd76e,#c07808);color:#3a2600}
.ldb.top2 .rank{background:linear-gradient(135deg,#dfe8f2,#9fb2c5);color:#22313f}
.ldb.top3 .rank{background:linear-gradient(135deg,#f0b490,#b0713f);color:#33160a}
.ldb .n{flex:1;min-width:0;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.ldb .w{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:800;color:var(--em)}

.stTabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stTab{border:1px solid var(--tg-border);background:var(--tg-panel);color:var(--tg-sub);font-family:inherit;font-weight:800;font-size:11.5px;padding:8px 12px;border-radius:10px;cursor:pointer}
.stTab.on{color:var(--em);border-color:rgba(23,221,98,.5);background:linear-gradient(135deg,rgba(23,221,98,.08),var(--tg-panel))}
.pctGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.pctBtn{border:1px solid var(--tg-border);background:var(--tg-panel2);font-family:inherit;font-weight:800;font-size:12.5px;padding:10px 2px;border-radius:10px;cursor:pointer}
.pctBtn.up{color:var(--fi-green)}
.pctBtn.dn{color:var(--fi-red)}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.plRow{display:flex;align-items:center;gap:8px;background:var(--tg-panel);border:1px solid var(--tg-border);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.plRow .n{flex:1;min-width:0;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plRow .w{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--tg-sub);font-weight:700}
.logItem{font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.5;background:var(--tg-panel);border:1px solid var(--tg-border);border-radius:10px;padding:8px 10px;margin-bottom:5px;color:#b9c6d2;word-break:break-word}
.permChip{font-size:9px;font-weight:800;letter-spacing:.5px;border-radius:5px;padding:2px 5px;font-family:'JetBrains Mono',monospace;background:rgba(61,255,139,.1);color:#a9f5c8;border:1px solid rgba(61,255,139,.3)}
.roleRow{display:flex;align-items:center;gap:8px;background:var(--tg-panel);border:1px solid var(--tg-border);border-radius:12px;padding:10px 12px;margin-bottom:6px;flex-wrap:wrap}
.roleRow .nm{font-weight:800;font-size:13px}
.checkRow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.checkRow label{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--tg-sub);background:var(--tg-panel2);border:1px solid var(--tg-border);border-radius:8px;padding:6px 9px;cursor:pointer}
.checkRow input{accent-color:#17dd62}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(14,22,33,.96);border:1px solid var(--tg-border);border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:700;color:var(--tg-text);display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tIn .2s ease-out;max-width:88vw}
.toast.out{opacity:0;transform:translateY(6px);transition:.3s}
.toast.success{border-color:rgba(47,212,106,.45)}
.toast.error{border-color:rgba(255,92,92,.45);color:#ffb1b1}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.offlineBox{padding:26px 16px;text-align:center}
.offlineBox .ico{font-size:44px}
.offlineBox h3{margin:10px 0 6px}
.offlineBox p{font-size:12.5px;color:var(--tg-sub);line-height:1.55}
</style>
</head>
<body>
<div id="phone">
  <div id="tgHeader">
    <div class="tgRow">
      <div class="tgAvatar"><svg viewBox="0 0 64 64"><path d="M32 2 L54 15 L54 49 L32 62 L10 49 L10 15 Z" fill="url(#emG)" stroke="#065c26" stroke-width="2.6" stroke-linejoin="round"/><path d="M32 25 L54 15 M32 25 L10 15 M32 25 L32 62" stroke="#065c26" stroke-width="1.4" opacity=".5" fill="none"/><text x="32" y="48" text-anchor="middle" font-family="Manrope,sans-serif" font-size="19" font-weight="800" fill="#eafff1">FI</text><defs><linearGradient id="emG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7bff9e"/><stop offset="1" stop-color="#0fa948"/></linearGradient></defs></svg></div>
      <div class="tgInfo">
        <div class="tgName">FI Mining Bot <span class="roleBadge" id="roleBadge"></span></div>
        <div class="tgStatus" id="netStatus"><span class="dotOnline"></span> подключение…</div>
      </div>
    </div>
  </div>
  <div id="balanceStrip">
    <div class="balCell">
      <div class="balLabel" id="fiLabel">монеты</div>
      <div class="balVal fi num" id="fiBal">—</div>
    </div>
    <div class="balCell">
      <div class="balLabel">доллары</div>
      <div class="balVal usd num" id="usdBal">—</div>
    </div>
    <div class="priceChip" id="priceChip">
      <div class="p num" id="priceVal">—</div>
      <div class="chg up" id="priceChg">—</div>
    </div>
  </div>
  <div id="screen"><div class="offlineBox"><div class="ico">🛰</div><h3>Подключаюсь к серверу…</h3><p>Ищу игровой API. Это занимает пару секунд.</p></div></div>
  <div id="tabBar">
    <button class="tabBtn" data-tab="market"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 8-9"/><path d="M15 6h6v6"/></svg>Рынок</button>
    <button class="tabBtn" data-tab="shop"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1.5 12h-13z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>Магазин</button>
    <button class="tabBtn" data-tab="top"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M17 4h4v2a4 4 0 01-4 4M7 4H3v2a4 4 0 004 4"/><path d="M7 4h10v5a5 5 0 01-10 0z"/></svg>Топ</button>
    <button class="tabBtn" data-tab="staff"><svg viewBox="0 0 24 24"><path d="M14.5 4a4 4 0 000 8M2 21v-2a6 6 0 016-6h4a6 6 0 016 6v2M18 8l2 2 3-3"/></svg>STAFF</button>
    <button class="tabBtn" data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>Я</button>
  </div>
</div>
<div id="toasts"></div>

<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
try{ if(tg){ tg.ready(); tg.expand(); if(tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } }catch(e){}

/* ---------- состояние клиента ---------- */
const INIT = tg ? (tg.initData || '') : '';
let S = null;             // снапшот с сервера
let role = null;          // {kind,name,color,perms}
let tab = localStorage.getItem('fiTabSrv') || 'market';
let stTab = 'give';
let tradeSide = 'buy';
let busy = false;
let apiBase = '';
let stRolesCache = [];

const $ = id => document.getElementById(id);
const fmt = n => { n = Number(n) || 0; if (Math.abs(n) >= 1000) return Math.floor(Math.abs(n)).toLocaleString('ru-RU').replace(/,/g, ' ') + (n < 0 ? '-' : ''); if (Math.abs(n) < 1 && n !== 0) return n.toFixed(4).replace(/0+$/, '').replace(/\.$/, ''); return n.toFixed(2); };
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function toast(msg, ico = 'ℹ️', type = '') {
  const el = document.createElement('div'); el.className = 'toast ' + type;
  el.innerHTML = `<span>${ico}</span><span>${esc(msg)}</span>`;
  $('toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 3600);
  const tw = $('toasts'); while (tw.children.length > 4) tw.firstChild.remove();
}
function setNet(online) {
  $('netStatus').innerHTML = online
    ? '<span class="dotOnline"></span> сервер в порядке'
    : '<span class="dotOffline"></span> нет связи с сервером';
}
function paintBadge(rl) {
  const b = $('roleBadge');
  if (rl && rl.name) {
    b.textContent = rl.name;
    b.className = 'roleBadge show';
    const c = /^#[0-9a-f]{6}$/i.test(rl.color || '') ? rl.color : '#3dff8b';
    b.style.color = c; b.style.background = c + '22'; b.style.borderColor = c + '66';
  } else {
    b.className = 'roleBadge'; b.textContent = ''; b.style.color = ''; b.style.background = ''; b.style.borderColor = '';
  }
}
function setRole(r) {
  role = r;
  paintBadge(r ? { name: r.name, color: r.color } : null);
}
function roleChipHTML(rl) {
  if (!rl) return '';
  const c = /^#[0-9a-f]{6}$/i.test(rl.color || '') ? rl.color : '#3dff8b';
  return `<span class="rBadge" style="color:${c};background:${c}22;border-color:${c}66">${esc(rl.name)}</span>`;
}

/* ---------- сеть ---------- */
async function findApi() {
  try {
    const r = await fetch('api.json?ts=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      if (j && j.api) return String(j.api).replace(/\/+$/, '');
    }
  } catch (e) {}
  return '';
}
async function sync(actions) {
  const res = await fetch(apiBase + '/api/sync', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ init: INIT, actions: actions || [] })
  });
  if (!res.ok) throw new Error('http ' + res.status);
  const j = await res.json();
  if (j.err === 'auth') throw new Error('auth');
  return j;
}
async function apiStaff(action) {
  const res = await fetch(apiBase + '/api/staff', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },

  });

function drawSpark(hist) {
  const cv = $('spark'); if (!cv || !hist || hist.length < 2) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 300, H = 96;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const ps = hist.map(h => h[1]);
  const min = Math.min(...ps), max = Math.max(...ps), rng = (max - min) || 1;
  const up = ps[ps.length - 1] >= ps[0];
  const col = up ? '#17dd62' : '#ff5c5c';
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, up ? 'rgba(23,221,98,.28)' : 'rgba(255,92,92,.28)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  const X = i => 2 + i * (W - 4) / (ps.length - 1);
  const Y = v => 6 + (1 - (v - min) / rng) * (H - 12);
  g.beginPath();
  ps.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)));
  g.strokeStyle = col; g.lineWidth = 2; g.stroke();
  g.lineTo(X(ps.length - 1), H); g.lineTo(X(0), H); g.closePath();
  g.fillStyle = grd; g.fill();
  g.fillStyle = col;
  g.beginPath(); g.arc(X(ps.length - 1), Y(ps[ps.length - 1]), 3, 0, 7); g.fill();
}

async function loadRoles(body) {
  body.innerHTML = '<div class="card" style="text-align:center;color:var(--tg-sub);font-size:12px">⏳ Загрузка…</div>';
  const j = await doStaff({ a: 'roles' });
  if (!j || !j.ok) { body.innerHTML = ''; return; }
  if (!body.isConnected) return;
  stRolesCache = j.roles || [];
  const assignedBy = j.assigned || {};
  let html = `<div class="sectionTitle">Создать роль</div>
    <div class="card">
      <label class="lbl">название (до 16 символов)</label>
      <input class="inp" id="rName" placeholder="Например: Модератор" maxlength="16">
      <label class="lbl">цвет</label>
      <input type="color" class="inpColor" id="rColor" value="#3dff8b">
      <label class="lbl">права</label>
      <div class="checkRow" id="rPerms">
        ${Object.entries(PERM_LABEL).map(([k, v]) => `<label><input type="checkbox" data-perm="${k}">${v}</label>`).join('')}
      </div>
      <button class="btn btn-em btn-lg" id="rAdd">➕ Создать роль</button>
    </div>
    <div class="sectionTitle">Существующие (${stRolesCache.length})</div>`;
  if (!stRolesCache.length) html += `<div class="card" style="text-align:center;color:var(--tg-sub);font-size:12px">Пока нет ролей. Создай первую!</div>`;
  stRolesCache.forEach(r => {
    const who = Object.entries(assignedBy).filter(([pid, rid]) => rid === r.id).map(([pid]) => pid);
    html += `<div class="roleRow">
      <span class="rBadge" style="color:${r.color};background:${r.color}22;border-color:${r.color}66">${esc(r.name)}</span>
      <span style="flex:1;font-size:10px;color:var(--tg-sub);font-family:'JetBrains Mono',monospace">${(r.perms || []).join('·') || 'без прав'}${who.length ? ' · у ' + who.length : ''}</span>
      <button class="btn btn-ghost btn-sm" data-redit="${r.id}">✏️</button>
      <button class="btn btn-red btn-sm" data-rdel="${r.id}">🗑</button>
    </div>`;
  });
  html += `<div class="card" style="font-size:11px;color:var(--tg-sub);line-height:1.55">Роли выдаются в разделе «👥 Игроки»: нажми на игрока → «6 — назначить роль». Значок роли виден в топе и профилях.</div>`;
  body.innerHTML = html;
  $('rAdd').onclick = () => {
    const name = ($('rName').value || '').trim();
    if (!name) return toast('Название роли?', '✏️');
    const perms = Array.from(document.querySelectorAll('#rPerms input:checked')).map(x => x.dataset.perm);
    doStaff({ a: 'roleAdd', name, color: $('rColor').value, perms }, '👑').then(j => { if (j && j.ok && body.isConnected) loadRoles(body); });
  };
  body.querySelectorAll('[data-rdel]').forEach(b => b.onclick = () => {
    const r = stRolesCache.find(x => x.id === b.dataset.rdel);
    if (!r) return;
    if (!confirm('Удалить роль «' + r.name + '»? У всех, кто её носил, значок пропадёт.')) return;
    doStaff({ a: 'roleDel', id: r.id }, '🗑').then(j => { if (j && j.ok && body.isConnected) loadRoles(body); });
  });
  body.querySelectorAll('[data-redit]').forEach(b => b.onclick = () => {
    const r = stRolesCache.find(x => x.id === b.dataset.redit);
    if (!r) return;
    const name = prompt('Новое название (пусто — не менять):', r.name);
    if (name === null) return;
    const color = prompt('Новый цвет (hex, например #ff5c5c):', r.color);
    if (color === null) return;
    const order = Object.keys(PERM_LABEL);
    const cur = r.perms || [];
    const inp = prompt('Права (номера через запятую):\n' + order.map((k, i) => (i + 1) + ' — ' + PERM_LABEL[k]).join('\n') + '\nТекущие: ' + (order.map((k, i) => cur.includes(k) ? (i + 1) : null).filter(x => x).join(',') || '—'), cur.map(k => order.indexOf(k) + 1).join(',') || '');
    if (inp === null) return;
    const perms = String(inp).split(',').map(x => order[Number(x.trim()) - 1]).filter(Boolean);
    const body2 = { a: 'roleUpd', id: r.id };
    if (name.trim()) body2.name = name.trim();
    if (color.trim()) body2.color = color.trim();
    body2.perms = perms;
    doStaff(body2, '✏️').then(j => { if (j && j.ok && body.isConnected) loadRoles(body); });
  });
}

/* --- игроки --- */
const stPlayersCache = [];
async function loadPlayers(body) {
  body.innerHTML = '<div class="card" style="text-align:center;color:var(--tg-sub);font-size:12px">⏳ Загрузка игроков…</div>';
  const j = await doStaff({ a: 'players' });
  if (!j || !j.ok || !j.players) { if (body.isConnected) body.innerHTML = '<div class="card" style="text-align:center;color:var(--tg-sub);font-size:12px">Не удалось загрузить.</div>'; return; }
  if (!body.isConnected) return;
  stPlayersCache.length = 0; stPlayersCache.push(...j.players);
  body.innerHTML = `<div class="sectionTitle">Игроки (${j.players.length}). Нажми, чтобы управлять.</div>` + j.players.map((pl, i) => `
    <div class="plRow" data-idx="${i}">
      <div class="n">${pl.b ? '🚫 ' : ''}${esc(pl.n)} ${roleChipHTML(pl.role)}</div>
      <div class="w num">${fmt(pl.fi)} ${esc(S.skin.coin || 'FI')} · $${fmt(pl.usd)}${pl.b ? ' · ' + esc(pl.r || 'бан') : ''}</div>
    </div>`).join('');
  body.querySelectorAll('[data-idx]').forEach(row => row.onclick = () => playerActions(stPlayersCache[Number(row.dataset.idx)]));
}
async function playerActions(pl) {
  const key = prompt('Действие для ' + pl.n + ':\n1 — выдать монеты\n2 — выдать USD\n3 — забрать монеты\n4 — забанить\n5 — разбанить' + (isO() ? '\n6 — назначить/снять роль' : ''), '1');
  if (!key) return;
  if (key === '1' || key === '2') {
    const amt = parseFloat(prompt('Сколько выдать?', '100') || '');
    if (!(amt > 0)) return;
    await doStaff({ a: 'give', kind: key === '1' ? 'fi' : 'usd', to: String(pl.id), amount: amt }, '🤝');
  } else if (key === '3') {
    const amt = parseFloat(prompt('Сколько монет забрать?', '100') || '');
    if (!(amt > 0)) return;
    await doStaff({ a: 'give', kind: 'fi', to: String(pl.id), amount: -amt }, '🤝');
  } else if (key === '4') {
    const r = prompt('Причина бана:', 'нарушение правил') || '';
    await doStaff({ a: 'ban', to: String(pl.id), reason: r }, '🚫');
  } else if (key === '5') await doStaff({ a: 'unban', to: String(pl.id) }, '✅');
  else if (key === '6' && isO()) await roleAssign(pl);
  if ($('stBody') && stTab === 'players') loadPlayers($('stBody'));
}
async function roleAssign(pl) {
  let j = await apiStaff({ a: 'roles' }).catch(() => null);
  if (!j || !j.ok) return;
  stRolesCache = j.roles || [];
  if (!stRolesCache.length) return toast('Сначала создай роль в «👑 Роли»', '👑', 'error');
  const cur = (j.assigned || {})[String(pl.id)];
  const lines = stRolesCache.map((r, i) => `${i + 1} — ${r.name} (${r.color})`).join('\n');
  const inp = prompt('Роль для ' + pl.n + (cur ? '\n(у него уже есть роль — введи 0 чтобы снять)' : '') + ':\n' + lines, cur ? '0' : '1');
  if (inp === null) return;
  const n = Number(inp.trim());
  if (n === 0) return void (await doStaff({ a: 'assign', to: String(pl.id), roleId: '' }, '👑'));
  const r = stRolesCache[n - 1];
  if (!r) return toast('Нет такой роли', '❌', 'error');
  await doStaff({ a: 'assign', to: String(pl.id), roleId: r.id }, '👑');
}

/* --- экономика (настройки) --- */
const CFG_FIELDS = [
  { k: 'startPrice', t: 'стартовая цена $', n: 1 },
  { k: 'buySpreadPct', t: 'спред покупки %', n: 1 },
  { k: 'sellSpreadPct', t: 'спред продажи %', n: 1 },
  { k: 'fiPerThHour', t: 'FI за 1 TH/час', n: 1 },
  { k: 'volatilityPct', t: 'волатильность %', n: 1 },
  { k: 'eventChancePct', t: 'шанс новости %', n: 1 },
  { k: 'bonusDailyUsd', t: 'бонус дня USD', n: 1 },
  { k: 'bonusDailyFi', t: 'бонус дня монет', n: 1 },
  { k: 'workIntervalMin', t: 'интервал работы, мин', n: 1 },
  { k: 'workPayMin', t: 'оплата от $', n: 1 },
  { k: 'workPayMax', t: 'оплата до $', n: 1 },
  { k: 'coinName', t: 'имя монеты', n: 0, max: 12 },
  { k: 'coinEmoji', t: 'эмодзи монеты', n: 0, max: 4 },
  { k: 'title', t: 'название бота', n: 0, max: 40 },
  { k: 'welcome', t: 'приветствие', n: 0, max: 300 }
];
async function settingsPanel(body) {
  const cfg = S.cfg || {};
  body.innerHTML = `<div class="card">
    ${CFG_FIELDS.map(f => `
      <label class="lbl">${f.t}</label>
      <input class="inp num" id="set_${f.k}" value="${esc(cfg[f.k] != null ? cfg[f.k] : '')}" ${f.n ? 'inputmode="decimal"' : ''}>
    `).join('')}
    <button class="btn btn-gold btn-lg" id="cfgSave">💾 Сохранить всё</button>
  </div>`;
  $('cfgSave').onclick = async () => {
    let ch = 0;
    for (const f of CFG_FIELDS) {
      const el = $('set_' + f.k);
      if (!el) continue;
      const raw = el.value.trim();
      if (!raw || String(raw) === String(cfg[f.k] != null ? cfg[f.k] : '')) continue;
      const j = await doStaff({ a: 'set', key: f.k, v: raw }, '⚙️');
      if (j && j.ok !== false) {
        ch++;
        cfg[f.k] = j.snap ? j.snap.cfg ? j.snap.cfg[f.k] : cfg[f.k] : cfg[f.k];
      }
    }
    toast(ch ? `💾 Сохранено (${ch})` : 'Нечего сохранять', '⚙️', 'success');
    if (body.isConnected) settingsPanel(body);
  };
}

/* --- журнал --- */
async function loadLog(body) {
  body.innerHTML = '<div class="card" style="text-align:center;color:var(--tg-sub);font-size:12px">⏳ Читаю журнал…</div>';
  const j = await doStaff({ a: 'log' });
  if (!j || !j.ok) { if (body.isConnected) body.innerHTML = ''; return; }
  if (!body.isConnected) return;
  body.innerHTML = (j.log || []).map(l => `<div class="logItem">${new Date(l[0]).toLocaleString('ru-RU')} — ${esc(l[1])}</div>`).join('') || '<div class="card" style="text-align:center;color:var(--tg-sub);font-size:12px">Журнал пуст.</div>';
}

/* --- биндинги staff-панелей --- */
function bindStaff() {
  const gFi = $('gFi');
  if (gFi) {
    gFi.onclick = () => staffGive('fi');
    $('gUsd').onclick = () => staffGive('usd');
  }
  document.querySelectorAll('.pctBtn[data-op]').forEach(b => b.onclick = () => {
    const op = b.dataset.op;
    const body = { a: 'price', op };
    if (b.dataset.pct) body.pct = Number(b.dataset.pct);
    doStaff(body, op === 'freeze' ? '❄️' : op === 'auto' ? '🤖' : '📈');
  });
  const sp = $('setPriceGo');
  if (sp) sp.onclick = () => {
    const v = parseFloat(($('setPriceInp').value + '').replace(',', '.'));
    if (!(v > 0)) return toast('Пришли число', '✏️');
    doStaff({ a: 'price', op: 'set', v }, '🎯');
  };
  document.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => {
    const w = b.dataset.reset;
    if (w === 'nuke' && !confirm('Удалить ВСЕХ игроков и историю? Ты останешься один.')) return;
    if (w === 'nuke' && !confirm('Точно? Отменить нельзя.')) return;
    doStaff({ a: 'reset', what: w }, '🧯');
  });
}
async function staffGive(kind) {
  const to = ($('gTarget').value || '').trim().replace(/^@/, '');
  const amount = parseFloat(($('gAmount').value + '').replace(',', '.'));
  if (!to) return toast('Кому? @ник / id / * для всех', '✏️');
  if (!(amount > 0)) return toast('Сколько выдать?', '✏️');
  const j = await doStaff({ a: 'give', kind, to, amount }, kind === 'usd' ? '💵' : '🪙');
  if (j && j.ok) $('gAmount').value = '';
}

/* ---------- вкладки и цикл ---------- */
function switchTab(t) { tab = t; localStorage.setItem('fiTabSrv', t); document.querySelectorAll('.tabBtn').forEach(b => b.classList.toggle('active', b.dataset.tab === t)); render(); }
document.querySelectorAll('.tabBtn').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

(async () => {
  apiBase = await findApi();
  document.querySelectorAll('.tabBtn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (!apiBase) {
    setNet(false);
    $('screen').innerHTML = `<div class="offlineBox"><div class="ico">☁️</div><h3>Игровой сервер не найден</h3><p>Файл api.json ещё не заполнен.<br>Когда облачный сервер (Render) подключат — полностью закрой и заново открой мини-приложение.</p></div>`;
    return;
  }
  await refresh();
  /* узнаём свою роль сразу (без ключей — по Telegram-подписи) */
  const j0 = await apiStaff({ a: 'who' }).catch(() => null);
  if (j0 && j0.ok && j0.role) { setRole(j0.role); if (tab === 'staff') render(); }
})().catch(e => console.error(e));

setInterval(() => { if (!document.hidden && S && apiBase) refresh().catch(() => {}); }, 2500);
document.addEventListener('visibilitychange', () => { if (!document.hidden && apiBase) refresh().catch(() => {}); });
</script>
